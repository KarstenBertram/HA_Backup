update_meldung:
  alias: Update-Meldung senden
  description: Sendet Meldungen der Update-Automationen an Markus (Pixel 11 Pro XL)
    und Nadine (iPhone). Empfänger nur hier pflegen.
  fields:
    message:
      name: Nachricht
      required: true
      selector:
        text:
          multiline: true
  icon: mdi:update
  max: 20
  mode: queued
  sequence:
  - action: notify.mobile_app_pixel_11_pro_xl
    continue_on_error: true
    data:
      message: '{{ message }}'
      title: HA Karsten – Updates
  - action: notify.mobile_app_ip_nadine
    continue_on_error: true
    data:
      message: '{{ message }}'
      title: HA Karsten – Updates
tor_oeffnen:
  alias: Tor öffnen (Vordereingang)
  description: Öffnet die Tür am Vordereingang über den Ring Intercom. Wird vom iOS-Widget
    (Aktion „Tor öffnen“) und Kurzbefehlen genutzt.
  icon: mdi:gate-open
  mode: single
  sequence:
  - action: button.press
    target:
      entity_id: button.vordereingang_tur_offnen
internetsperre_sperren:
  alias: Internetsperre – Gerät sperren
  description: Sperrt ein Kindergerät nach der eingestellten Vorlaufzeit (0 = sofort).
    Startet den Vorlauf-Timer und kündigt die Sperre auf Echo und iPhone des Kindes
    an.
  fields:
    ansage:
      default: true
      description: Kind per Echo und iPhone vorwarnen
      name: Ansage
      selector:
        boolean: {}
    geraet:
      name: Gerät
      required: true
      selector:
        select:
          options:
          - label: Tim iPhone
            value: tim_iphone
          - label: Tim Laptop
            value: tim_laptop
          - label: Merle iPhone
            value: merle_iphone
          - label: Merle Tablet
            value: merle_tablet
  icon: mdi:lock-clock
  max: 10
  mode: parallel
  sequence:
  - variables:
      geraete:
        merle_iphone:
          kind: merle
          name: iPhone
        merle_tablet:
          kind: merle
          name: Tablet
        tim_iphone:
          kind: tim
          name: iPhone
        tim_laptop:
          kind: tim
          name: Laptop
      kinder:
        merle:
          kanaele:
          - notify.merle_sprechen
          - notify.iphone_merle
          name: Merle
        tim:
          kanaele:
          - notify.echo_sprechen
          - notify.iphone_tim
          name: Tim
  - variables:
      geraetename: '{{ geraete[geraet].name }}'
      kind: '{{ geraete[geraet].kind }}'
      vorlauf: '{{ states(''input_number.internetsperre_'' ~ geraet ~ ''_vorlauf'')
        | int(5) }}'
  - condition: template
    value_template: '{{ is_state(''input_boolean.internetsperre_'' ~ geraet ~ ''_manuell'',
      ''off'') }}'
  - else:
    - action: timer.start
      data:
        duration: '{{ ''%02d:%02d:00'' | format(vorlauf | int // 60, vorlauf | int
          % 60) }}'
      target:
        entity_id: timer.internetsperre_{{ geraet }}_vorlauf_timer
    - if:
      - condition: template
        value_template: '{{ ansage }}'
      then:
      - action: notify.send_message
        continue_on_error: true
        data:
          message: '{{ kinder[kind].name }}, dein {{ geraetename }} geht in {{ vorlauf
            }} {{ ''Minute'' if vorlauf | int == 1 else ''Minuten'' }} offline.'
        target:
          entity_id: '{{ kinder[kind].kanaele }}'
    if:
    - condition: template
      value_template: '{{ vorlauf | int == 0 }}'
    then:
    - action: timer.cancel
      target:
        entity_id: timer.internetsperre_{{ geraet }}_vorlauf_timer
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.internetsperre_{{ geraet }}_manuell
internetsperre_freigeben:
  alias: Internetsperre – Gerät freigeben
  description: Bricht einen laufenden Vorlauf ab und hebt die manuelle Sperre eines
    Kindergeräts auf. Während einer aktiven Nachtsperre bleibt das Gerät gesperrt
    (dafür Überbrückung nutzen).
  fields:
    geraet:
      name: Gerät
      required: true
      selector:
        select:
          options:
          - label: Tim iPhone
            value: tim_iphone
          - label: Tim Laptop
            value: tim_laptop
          - label: Merle iPhone
            value: merle_iphone
          - label: Merle Tablet
            value: merle_tablet
  icon: mdi:lock-open-variant
  max: 10
  mode: parallel
  sequence:
  - action: timer.cancel
    target:
      entity_id: timer.internetsperre_{{ geraet }}_vorlauf_timer
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.internetsperre_{{ geraet }}_manuell
internetsperre_kind_sperren:
  alias: Internetsperre – alle Geräte eines Kindes sperren
  description: Startet für jedes Gerät des Kindes die Sperre mit dessen eigener Vorlaufzeit.
    Eine gemeinsame Ansage statt einer pro Gerät.
  fields:
    kind:
      name: Kind
      required: true
      selector:
        select:
          options:
          - label: Tim
            value: tim
          - label: Merle
            value: merle
  icon: mdi:account-lock
  max: 4
  mode: parallel
  sequence:
  - variables:
      kinder:
        merle:
          geraete:
          - merle_iphone
          - merle_tablet
          kanaele:
          - notify.merle_sprechen
          - notify.iphone_merle
          name: Merle
        tim:
          geraete:
          - tim_iphone
          - tim_laptop
          kanaele:
          - notify.echo_sprechen
          - notify.iphone_tim
          name: Tim
  - variables:
      minuten: '{{ kinder[kind].geraete | map(''regex_replace'', ''^(.*)$'', ''input_number.internetsperre_\\1_vorlauf'')
        | map(''states'') | map(''int'', 5) | min }}'
  - repeat:
      for_each: '{{ kinder[kind].geraete }}'
      sequence:
      - action: script.internetsperre_sperren
        data:
          ansage: false
          geraet: '{{ repeat.item }}'
  - if:
    - condition: template
      value_template: '{{ minuten | int > 0 }}'
    then:
    - action: notify.send_message
      continue_on_error: true
      data:
        message: '{{ kinder[kind].name }}, dein Internet geht in {{ minuten }} {{
          ''Minute'' if minuten | int == 1 else ''Minuten'' }} aus.'
      target:
        entity_id: '{{ kinder[kind].kanaele }}'
internetsperre_kind_freigeben:
  alias: Internetsperre – alle Geräte eines Kindes freigeben
  description: Bricht Vorläufe ab und hebt die manuelle Sperre aller Geräte eines
    Kindes auf. Eine aktive Nachtsperre bleibt bestehen (dafür Überbrückung nutzen).
  fields:
    kind:
      name: Kind
      required: true
      selector:
        select:
          options:
          - label: Tim
            value: tim
          - label: Merle
            value: merle
  icon: mdi:account-lock-open
  max: 4
  mode: parallel
  sequence:
  - variables:
      kinder:
        merle:
        - merle_iphone
        - merle_tablet
        tim:
        - tim_iphone
        - tim_laptop
  - repeat:
      for_each: '{{ kinder[kind] }}'
      sequence:
      - action: script.internetsperre_freigeben
        data:
          geraet: '{{ repeat.item }}'
internetsperre_uberbrucken:
  alias: Internetsperre – Nachtsperre überbrücken
  description: Überbrückt die Nachtsperre für ein Kind bis zur eingestellten Endzeit
    (input_datetime.internetsperre_<kind>_uberbruckt_bis, höchstens 06:00). Gilt für
    eine Nacht; um 06:00 automatisch zurückgesetzt. Mit aufheben=true wird die Überbrückung
    beendet.
  fields:
    aufheben:
      default: false
      name: Überbrückung aufheben
      selector:
        boolean: {}
    kind:
      name: Kind
      required: true
      selector:
        select:
          options:
          - label: Tim
            value: tim
          - label: Merle
            value: merle
  icon: mdi:weather-night
  max: 4
  mode: parallel
  sequence:
  - else:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.internetsperre_{{ kind }}_uberbruckt
    if:
    - condition: template
      value_template: '{{ aufheben }}'
    then:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.internetsperre_{{ kind }}_uberbruckt
git_backup:
  alias: Git-Backup auslösen
  description: Startet die App Advanced SSH & Web Terminal neu. Deren init_command
    committet alle Änderungen in /homeassistant und pusht sie nach GitHub (KarstenBertram/HA_Backup).
    Ergebnis in input_text.git_backup_status und im App-Log ([GIT] ...).
  icon: mdi:source-branch-sync
  mode: single
  sequence:
  - action: hassio.addon_restart
    data:
      addon: a0d7b954_ssh
batterie_wochenbericht:
  alias: Batterie-Wochenbericht erstellen und senden
  description: 'Erstellt den Batteriebericht für alle Battery-Notes-Geräte mit Wechselbatterie
    (ohne Handys/Tablets der Mobile App und ohne Ausnahmen) und sendet ihn an die
    übergebenen notify-Aktionen. Einstufung: ausgefallen = nicht erreichbar oder seit
    stumm_stunden kein Wert irgendeiner Entität; niedrig = Battery Notes meldet niedrig;
    sonst OK. Angelegt 23.11.2026.'
  fields:
    empfaenger:
      description: Liste von notify-Aktionen, z. B. notify.mobile_app_ip_nadine
      example: '["notify.mobile_app_ip_nadine"]'
      name: Empfänger
      required: true
      selector:
        object: {}
  icon: mdi:battery-alert-variant-outline
  mode: single
  sequence:
  - action: battery_notes.check_battery_last_reported
    data:
      days_last_reported: 1
      raise_events: false
    note: 'Nur lesen: Geräte, deren Batteriestand seit mindestens 1 Tag nicht gemeldet
      wurde (Battery Notes speichert das dauerhaft, auch über Neustarts).'
    response_variable: bn_meld
  - action: battery_notes.check_battery_low
    data:
      raise_events: false
    note: 'Nur lesen: Geräte unter der Battery-Notes-Schwelle.'
    response_variable: bn_low
  - note: 'Ausnahmen: Ring Vordereingang ist fest verkabelt (23.11.2026).'
    variables:
      ausnahmen:
      - sensor.vordereingang_battery_plus
      bn_meldung: '{% set ns = namespace(d={}) %}{% for x in bn_meld.check_battery_last_reported
        %}{% set ns.d = dict(ns.d, **{x.device_id: {''tage'': x.battery_last_reported_days,
        ''stand'': x.battery_last_reported_level, ''datum'': x.battery_last_reported}})
        %}{% endfor %}{{ ns.d }}'
      niedrig_ids: '{{ bn_low.check_battery_battery_low | map(attribute=''device_id'')
        | list }}'
      stumm_stunden: 24
  - variables:
      geraete: '{% set bn = integration_entities(''battery_notes'') %}{% set funkname
        = {''mqtt'': ''Zigbee'', ''matter'': ''Thread/Matter''} %}{% set ns = namespace(l=[])
        %}{% for e in bn | select(''match'', ''sensor\..*_battery_plus(_\d+)?$'')
        | reject(''in'', ausnahmen) %}{% set d = device_id(e) %}{% set ids = (device_attr(d,
        ''identifiers'') or []) | list %}{% set funk = ids[0][0] if ids else ''unbekannt''
        %}{% if funk != ''mobile_app'' %}{% set ents = device_entities(d) | reject(''in'',
        bn) | select(''match'', ''(sensor|binary_sensor)\.'') | list %}{% set live
        = expand(ents) | rejectattr(''state'', ''in'', [''unavailable'', ''unknown''])
        | list %}{% set zuletzt = (live | map(attribute=''last_reported'') | map(''as_timestamp'')
        | max) if live else none %}{% set bnd = device_entities(d) | select(''in'',
        bn) | list %}{% set typ_e = bnd | select(''search'', ''_battery_type'') |
        first %}{% set wechsel_e = bnd | select(''search'', ''_battery_last_replaced'')
        | first %}{% set m = bn_meldung.get(d) %}{% set stand = states(e) | float
        | round(0) | int if is_number(states(e)) else ((m[''stand''] | round(0) |
        int) if m and m[''stand''] is not none else none) %}{% if not live %}{% set
        status = ''ausgefallen'' %}{% set grund = ''nicht erreichbar'' %}{% elif zuletzt
        < as_timestamp(now()) - stumm_stunden * 3600 %}{% set status = ''ausgefallen''
        %}{% set grund = ''keine Werte seit '' ~ (zuletzt | timestamp_custom(''%d.%m.
        %H:%M'')) %}{% elif d in niedrig_ids %}{% set status = ''niedrig'' %}{% set
        grund = '''' %}{% else %}{% set status = ''ok'' %}{% set grund = '''' %}{%
        endif %}{% set ns.l = ns.l + [{''name'': device_attr(d, ''name_by_user'')
        or device_attr(d, ''name''), ''funk'': funkname.get(funk, funk), ''status'':
        status, ''grund'': grund, ''stand'': stand, ''typ'': states(typ_e) if typ_e
        else ''–'', ''gewechselt'': (as_timestamp(states(wechsel_e), none) | timestamp_custom(''%d.%m.%Y'',
        true, ''–'')) if wechsel_e else ''–'', ''bat_tage'': m[''tage''] if m else
        0, ''bat_datum'': (as_timestamp(m[''datum''], none) | timestamp_custom(''%d.%m.%Y'',
        true, ''–'')) if m else ''''}] %}{% endif %}{% endfor %}{{ ns.l }}'
  - variables:
      hinweise: '{% set h = [] %}{% set zb = geraete | selectattr(''funk'', ''eq'',
        ''Zigbee'') | list %}{% if zb and not is_state(''binary_sensor.zigbee2mqtt_bridge_connection_state'',
        ''on'') %}{% set h = h + [''Zigbee2MQTT ist offline: Die Zigbee-Geräte fallen
        vermutlich deshalb aus, nicht wegen der Batterie.''] %}{% endif %}{% set th
        = geraete | selectattr(''funk'', ''eq'', ''Thread/Matter'') | list %}{% if
        th | count > 1 and th | selectattr(''status'', ''eq'', ''ausgefallen'') |
        list | count == th | count %}{% set h = h + [''Alle Thread/Matter-Geräte sind
        offline: vermutlich Border Router oder Matter-Server, nicht die Batterien.'']
        %}{% endif %}{{ h }}'
      nachricht: "{% set aus = geraete | selectattr('status', 'eq', 'ausgefallen')
        | list %}{% set low = geraete | selectattr('status', 'eq', 'niedrig') | list
        %}{% set ok = geraete | selectattr('status', 'eq', 'ok') | list %}{% for x
        in hinweise %}⚠️ {{ x }}\n{% endfor %}{% if aus %}\U0001F7E7 Ausgefallen ({{
        aus | count }}):\n{% for g in aus %}• {{ g.name }} ({{ g.funk }}): {{ g.grund
        }}. Letzter Batteriestand {{ g.stand ~ ' %' if g.stand is not none else 'unbekannt'
        }}{{ ' am ' ~ g.bat_datum if g.bat_datum else '' }}. Batterie: {{ g.typ }}\n{%
        endfor %}{% endif %}{% if low %}\U0001F7E5 Batterie niedrig ({{ low | count
        }}):\n{% for g in low %}• {{ g.name }}: {{ g.stand }} %. Batterie: {{ g.typ
        }}\n{% endfor %}{% endif %}{% if not aus and not low %}\U0001F7E9 Keine Batterie
        niedrig, kein Gerät ausgefallen.\n{% endif %}{% if ok %}\U0001F7E6 OK ({{
        ok | count }}):\n{% for g in ok %}• {{ g.name }}: {{ g.stand }} % (gewechselt
        {{ g.gewechselt }}){{ ', Batteriestand seit ' ~ g.bat_tage ~ ' Tagen nicht
        gemeldet' if g.bat_tage >= 7 else '' }}\n{% endfor %}{% endif %}"
  - note: Ein nicht erreichbares Handy soll die Meldung an die anderen nicht verhindern.
    repeat:
      for_each: '{{ empfaenger }}'
      sequence:
      - action: '{{ repeat.item }}'
        continue_on_error: true
        data:
          message: '{{ nachricht }}'
          title: "\U0001F50B Batterie-Wochenbericht {{ now().strftime('%d.%m.%Y')
            }}"
