esphome:
  name: gasundwasser
  friendly_name: GasundWasser

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret gasundwasser_api_key

ota:
  - platform: esphome
    password: !secret gasundwasser_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Gasundwasser Fallback Hotspot"
    password: !secret gasundwasser_ap_password

captive_portal:

web_server:
  port: 80
  version: 3

globals:
  - id: total_pulses
    type: int 
    restore_value: false
    initial_value: '0'

  - id: impuls_ratio
    type: float
    restore_value: False
    initial_value: '0.01'  

binary_sensor:
  - platform: gpio
    id: gpio25_counter
    
    pin:
      number: GPIO25
      mode: INPUT
      inverted: true
    name: "Gaszähler Impuls"
#    filters:
#      - delayed_on: 100ms
#      - delayed_off: 100ms
    on_press:
      then:
        - lambda: id(total_pulses) += 1;

  - platform: status
    name: "Gaszähler Status"

sensor:
  - platform: template
    name: "Gasverbrauch-M3"
    device_class: gas
    unit_of_measurement: "m³"
    state_class: total_increasing
    icon: "mdi:fire"
    accuracy_decimals: 2
    lambda: |-
      return id(total_pulses) = id(impuls_ratio);
      ESP_LOGD("Gaszähler m³ TAG", "Pulse bisher %d", id(total_pulses));
  - platform: template
    name: "Gasverbrauch-kWh"
    device_class: gas
    unit_of_measurement: "kWh"
    state_class: total_increasing
    icon: "mdi:fire"
    accuracy_decimals: 2
    lambda: |-
      return id(total_pulses) = id(impuls_ratio) *10;
      ESP_LOGD("Gaszähler kWh Tag", "Pulse bisher %d", id(total_pulses));


    