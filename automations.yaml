- id: '1763122122805'
  alias: Batterie niedrig Meldung – alle Battery+ Sensoren (vollautomatisch)
  description: 'Meldet an Nadines iPhone, sobald ein Battery-Notes-Sensor (Battery+
    niedrig) auf ''niedrig'' wechselt. Neuaufbau 06.10.2026: State-Trigger statt fehlerhaftem
    Template-Trigger; keine dynamisch erzeugten input_datetime-Helfer mehr. Neue Battery+-Sensoren
    müssen in die Trigger-Liste aufgenommen werden.'
  triggers:
  - entity_id:
    - binary_sensor.ip_nadine_battery_plus_low_2
    - binary_sensor.iphone_von_bertram_battery_plus_low
    - binary_sensor.ipad_von_bertram_battery_plus_low
    - binary_sensor.iphone_merle_battery_plus_low
    - binary_sensor.iphone_tim_battery_plus_low
    - binary_sensor.wasseralarm_battery_plus_low
    - binary_sensor.schildkrote_1_battery_plus_low
    - binary_sensor.schildkrote_9900_battery_plus_low
    - binary_sensor.temperatur_0656_battery_plus_low
    - binary_sensor.temperatur_4249_battery_plus_low
    - binary_sensor.vordereingang_battery_plus_low
    not_from:
    - unavailable
    - unknown
    note: Nur echte Wechsel off -> on; Neustart/Verbindungsabbruch lösen keine Meldung
      aus.
    to: 'on'
    trigger: state
  conditions: []
  actions:
  - variables:
      geraet: '{{ trigger.to_state.name | replace('' Batterie fast leer'', '''') }}'
      lr: '{{ trigger.to_state.attributes.battery_last_replaced | default(none) }}'
  - action: notify.mobile_app_ip_nadine
    data:
      message: '{{ geraet }} meldet eine niedrige Batterie.

        Typ: {{ trigger.to_state.attributes.battery_type | default(''unbekannt'')
        }} · Anzahl: {{ trigger.to_state.attributes.battery_quantity | default(''–'')
        }}

        Zuletzt gewechselt: {{ (lr | as_timestamp(none)) | timestamp_custom(''%d.%m.%Y'',
        true, ''keine Angabe'') if lr else ''keine Angabe'' }}'
      title: "\U0001F50B Batteriewarnung"
  max: 20
  mode: parallel
- id: '1763122381066'
  alias: Wochenbericht – Batteriestatus aller Sensoren
  description: ''
  triggers:
  - at: 09:00:00
    trigger: time
  conditions:
  - condition: time
    weekday:
    - sun
  actions:
  - variables:
      sensors: "{{ expand(states.binary_sensor)\n    | selectattr('attributes.device_class','eq','battery')
        \n    | list }}\n"
      low_list: "{% for s in sensors if s.state == 'on' %}\n  • {{ s.attributes.friendly_name
        }}  \n    \U0001F50B Typ: {{ s.attributes.battery_type | default('–') }}  \n
        \   \U0001F522 Anzahl: {{ s.attributes.battery_quantity | default('–') }}
        \ \n    \U0001F4C5 Letzter Wechsel: {{ s.attributes.battery_last_replaced
        | default('keine Angabe') }}\n{% endfor %}\n"
      ok_list: "{% for s in sensors if s.state != 'on' %}\n  • {{ s.attributes.friendly_name
        }}  \n    \U0001F50B Typ: {{ s.attributes.battery_type | default('–') }}  \n
        \   \U0001F522 Anzahl: {{ s.attributes.battery_quantity | default('–') }}
        \ \n    \U0001F4C5 Letzter Wechsel: {{ s.attributes.battery_last_replaced
        | default('keine Angabe') }}\n{% endfor %}\n"
  - data:
      message: "\U0001F4CA *Wochenbericht – Batteriestatus*   Datum: {{ now().strftime('%d.%m.%Y')
        }}\n{% if low_list.strip() %} \U0001F7E5 *Batterie niedrig:* {{ low_list }}
        {% else %} \U0001F7E9 Keine Sensoren mit niedriger Batterie!   {% endif %}\n\U0001F7E6
        *Batterien OK:* {{ ok_list }}\n"
    action: notify.mobile_app_ip_nadine
  mode: single
