- id: '1760122984895'
  alias: Waschmaschine – Start & Fertig
  description: 'Start: Leistung > 10 W für 1 Min. setzt input_boolean.waschmaschine_lauft.
    Fertig: < 6 W für 5 Min. meldet nur, wenn vorher ein Start erkannt wurde (verhindert
    Fehlmeldungen nach HA-Neustart oder Zigbee-Ausfall).'
  triggers:
  - above: 10
    entity_id: sensor.waschmaschine_power
    for:
      minutes: 1
    id: start
    trigger: numeric_state
  - below: 6
    entity_id: sensor.waschmaschine_power
    for:
      minutes: 5
    id: fertig
    trigger: numeric_state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: start
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.waschmaschine_lauft
    - conditions:
      - condition: trigger
        id: fertig
      - condition: state
        entity_id: input_boolean.waschmaschine_lauft
        state: 'on'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.waschmaschine_lauft
      - action: notify.mobile_app_ip_nadine
        data:
          message: Waschmaschine ist fertig!
      - action: notify.send_message
        data:
          message: Waschmaschine fertig
        target:
          entity_id: notify.nadines_echo_durchsagen
  mode: queued
- id: '1760274307411'
  alias: Müll – Abholerinnerung
  description: 'Täglich 18:00: Gelber Sack (sensor.gelb), Restmüll (sensor.rest) und
    Papier (Kalender calendar.papier) für morgen prüfen, eine gemeinsame Meldung an
    Nadine. Papiertermine für 2027 im Kalender Papier nachtragen.'
  triggers:
  - at: '18:00:00'
    trigger: time
  conditions: []
  actions:
  - action: calendar.get_events
    data:
      end_date_time: '{{ (today_at() + timedelta(days=2, seconds=-1)).isoformat()
        }}'
      start_date_time: '{{ (today_at() + timedelta(days=1)).isoformat() }}'
    response_variable: papier
    target:
      entity_id: calendar.papier
  - variables:
      muell: '{% set ns = namespace(l=[]) %}{% if is_state(''sensor.gelb'', ''Tomorrow'')
        %}{% set ns.l = ns.l + [''Gelber Sack''] %}{% endif %}{% if is_state(''sensor.rest'',
        ''Tomorrow'') %}{% set ns.l = ns.l + [''Restmüll''] %}{% endif %}{% if papier[''calendar.papier''].events
        | count > 0 %}{% set ns.l = ns.l + [''Papier''] %}{% endif %}{{ ns.l }}'
  - if:
    - condition: template
      value_template: '{{ muell | count > 0 }}'
    then:
    - action: notify.mobile_app_ip_nadine
      data:
        message: '{{ muell | join('' und '') }} morgen'
  mode: single
